version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pethotel-db
    environment:
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password
      POSTGRES_DB: pethotel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: pethotel-app
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://hotel_user:hotel_password@postgres:5432/pethotel_db?sslmode=disable
      JWT_SECRET: super-secret-key-production-change-this
      GIN_MODE: release
    depends_on:
      - postgres

volumes:
  pgdata:
