<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งเตือนข้อผิดพลาด - Pet Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8 text-center">
        <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <span class="inline-block px-3 py-1 bg-rose-50 text-rose-700 text-xs font-mono font-bold rounded-full mb-2">
            HTTP Status: {{ .Code }}
        </span>
        <h1 class="text-xl font-bold text-slate-800 mb-2">เกิดข้อผิดพลาดในการร้องขอ</h1>
        <p class="text-slate-600 text-sm mb-6">{{ .Message }}</p>

        <div class="space-y-2">
            <a href="/dashboard" class="block w-full py-2.5 px-4 bg-amber-500 hover:bg-amber-600 text-white font-medium rounded-xl transition text-sm shadow-sm">
                <i class="fa-solid fa-house mr-1.5"></i> กลับสู่หน้าหลัก
            </a>
            <a href="javascript:history.back()" class="block w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition text-sm">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> ย้อนกลับไปหน้าก่อนหน้า
            </a>
        </div>
    </div>
</body>
</html>
