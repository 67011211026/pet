<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Pet Hotel & Daycare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                <i class="fa-solid fa-paw"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Pet Hotel & Daycare</h1>
            <p class="text-slate-500 text-sm mt-1">ระบบฝากเลี้ยงและดูแลสัตว์เลี้ยงแสนรัก</p>
        </div>

        {{ if .Error }}
        <div class="mb-5 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm flex items-center gap-3">
            <i class="fa-solid fa-circle-exclamation text-rose-500 text-base"></i>
            <span>{{ .Error }}</span>
        </div>
        {{ end }}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">อีเมลผู้ใช้งาน</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" name="email" required placeholder="owner@example.com"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent text-sm">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent text-sm">
                </div>
            </div>

            <button type="submit" 
                class="w-full py-3 px-4 bg-amber-500 hover:bg-amber-600 text-white font-medium rounded-xl transition duration-150 shadow-md shadow-amber-200 flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center text-sm text-slate-600">
            ยังไม่มีบัญชีผู้ใช้? 
            <a href="/register" class="text-amber-600 font-semibold hover:underline">สมัครสมาชิก</a>
        </div>

        <div class="mt-4 p-3 bg-amber-50 rounded-xl border border-amber-200 text-xs text-amber-800 space-y-1">
            <p class="font-bold flex items-center gap-1"><i class="fa-solid fa-key"></i> บัญชีทดสอบที่มีในระบบ:</p>
            <p>• <b>Admin:</b> admin@pethotel.com / admin123456</p>
            <p>• <b>User:</b> user@pethotel.com / user123456</p>
        </div>
    </div>
</body>
</html>
